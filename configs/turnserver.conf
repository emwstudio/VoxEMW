# VoxEMW WebRTC 用 TURN 服务（coturn）：SSH 隧道场景媒体中继。
# 浏览器 →(隧道 TCP)→ 本机 :3478 → relay →(loopback UDP)→ orchestrator aiortc。
# 只听 loopback：不对外暴露，账号为静态长凭据即可。
# 启动：turnserver -c configs/turnserver.conf（start_assistant.sh 已内置）
listening-port=3478
listening-ip=127.0.0.1
relay-ip=127.0.0.1
fingerprint
lt-cred-mech
realm=voxemw
user=voxemw:voxemw-turn-2026
log-file=stdout
verbose
