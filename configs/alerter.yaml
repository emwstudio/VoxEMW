# VoxEMW 峰哥反指提示器配置 —— AutoDL RTX 4090D（24GB）
#
# 用法：
#   python -m voxemw.server --config configs/alerter.yaml
#   python -m voxemw.server --no-tts            # 本地无 GPU 调试（音频接口返回 503）
#
# 五块积木：VAD / STT / LLM / TTS / 人设，全部在此声明、可替换。
# VAD/STT 默认 webspeech（浏览器端），LLM=DeepSeek（服务端），
# TTS=VoxCPM2（服务端），人设=prompt 文件（服务端加载）。

blocks:
  # ---------------------------------------------------------------------------
  # VAD/STT：webspeech = 浏览器端 Web Speech API（免服务端算力），
  # lang 用于 SpeechRecognition.lang。
  # ---------------------------------------------------------------------------
  vad:     { impl: webspeech }
  stt:     { impl: webspeech, lang: zh-CN }

  # ---------------------------------------------------------------------------
  # LLM：反指短报撰写。OpenAI 兼容 /v1/chat/completions。
  #   api_key_env：从环境变量读 key（server 会加载仓库根 .env.local），缺失即报错
  # ---------------------------------------------------------------------------
  llm:
    impl: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.7
    max_tokens: 500
    timeout: 30

  # ---------------------------------------------------------------------------
  # TTS：openbmb/VoxCPM2 音色克隆（Ultimate Cloning：ref_audio 同时作续写
  # prompt + 克隆 reference，配 ref_text 逐字台词）。输出原生 48kHz。
  # ---------------------------------------------------------------------------
  tts:
    impl: voxcpm2
    model_name: openbmb/VoxCPM2
    device: cuda              # 别写 cuda:0——官方 optimize() 只认字符串 "cuda"
    cfg_value: 2.0            # 官方推荐值；越大越贴近参考音色，过高会僵硬
    inference_timesteps: 10   # 扩散步数，官方推荐 10；调低更快更糙
    optimize: true            # torch.compile：启动慢一两分钟，RTF ~1.0 降到 ~0.3-0.5

  # ---------------------------------------------------------------------------
  # 人设：prompt 文件，服务端加载（path 相对仓库根）。
  # ---------------------------------------------------------------------------
  persona: { impl: file, path: personas/newsanchor.md }

# ---------------------------------------------------------------------------
# 反指提示器参数：监控对象与短报约束。
# ---------------------------------------------------------------------------
alerter: { weibo_name: 峰哥亡命天涯, date_scope: today, max_briefing_chars: 150 }

# ---------------------------------------------------------------------------
# 音色：key = 音色 id（API/前端选择用），name = 显示名。
# 素材要求：ref.wav 10-30s 清晰单人声（无背景音/音乐），ref.txt 为其逐字台词。
# 新增音色：放素材到 assets/<id>/，在此加同名条目，重启服务（启动时统一预建
# prompt cache，暂不支持热加载）。
# ---------------------------------------------------------------------------
voices:
  fengge:
    name: 峰哥亡命天涯
    ref_audio: assets/fengge/ref.wav
    ref_text: assets/fengge/ref.txt

# ---------------------------------------------------------------------------
# 服务参数：单端口同时供静态警报页（web/）和 /api/*。
# ---------------------------------------------------------------------------
server: { host: 0.0.0.0, port: 8000 }
