# VoxEMW 满血版（4090/24GB）—— 见 docs/plan-4090.md
# STT: Qwen3-ASR-1.7B / TTS: VoxCPM2 全精度 / LLM: DeepSeek API / 数字人: SoulX-FlashHead
# 眼睛: MiniCPM-V-4.6（vLLM）。Mac 轻量档见 configs/assistant.yaml + git tag v1.9.0

vad:
  backend: silero
  min_silence_ms: 64
stt:
  backend: qwen3asr
  model_name: Qwen/Qwen3-ASR-1.7B-hf  # -hf 变体：transformers 原生 key 布局（非 -hf 是 thinker.* 布局，5.x 加载丢权重）
  device: cuda
  language: Chinese
  hotwords:
  - 河南妮儿
  - 恁
  - 中
  - 得劲
  corrections: {}
llm:
  backend: chat-completions
  model_name: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  stream: true
  stream_batch_sentences: 1
  chat_size: 30
  reasoning_effort: none
tts:
  backend: voxcpm2
  model_name: openbmb/VoxCPM2
  device: cuda
  cfg_value: 2.0
  inference_timesteps: 10
  sample_rate: 16000
rtc:
  # 4090/AutoDL 远程部署：浏览器只能走 TCP 隧道，WebRTC 的 UDP 媒体过不去
  # （ICE 永远卡 checking）。关掉 RTC，下行音频走 WS（前端 WebAudio 播放）。
  # Mac 本地/LAN 部署回 true（低延迟 Opus 音轨）。
  enabled: false
  browser_ice_servers: []
vision:
  enabled: true
  vlm_url: http://127.0.0.1:18099
avatar:
  # SoulX-FlashHead 数字人渲染服务（voxemw/avatar/soulx_server.py，flashhead env 起）
  enabled: true
  url: ws://127.0.0.1:8791
  # 前端音频播放压后量：渲染链路固有滞后 = 0.96s 攒 chunk + ~0.27s 生成，
  # 音频压后同量即唇形对齐（WS 音频模式专用，RTC 模式用 ?alead= 参数）
  audio_lead_ms: 1300
personas:
  default: henannier
  list:
    henannier: personas/henannier.md
server:
  s2s_host: 127.0.0.1
  s2s_port: 8765
  host: 0.0.0.0
  port: 8000
  log_level: info
  enable_live_transcription: false
  num_pipelines: 1
