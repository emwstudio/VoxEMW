# VoxEMW 本地 Mac 极简版 —— Apple Silicon（M5 16GB），无数字人/无唱歌
#
# 与云端 configs/assistant.yaml 的差异：
# - 无数字人（AVTR-1 是 TensorRT/NVIDIA 专用，Mac 死路）：avatar.enabled: false，
#   前端自动降级纯语音模式（静态肖像）
# - STT/TTS 走 MPS（Apple GPU）。VoxCPM2 在 MPS 上被官方强制 float32
#  （bf16 数值漂移），2B 模型 ~8G 内存——16G 机器偏紧，optimize 必须关
#  （torch.compile 是 CUDA 路径）
# - LLM 不变：DeepSeek API（key 从 .env.local 读）
# - RTC 保留（aiortc 在 Mac 正常，音频下行唯一通道）：localhost 直连，
#   不需要 coturn/TURN（host candidate 即可）
#
# 用法：
#   bash scripts/start_mac.sh    # pipeline + orchestrator（皆 .venv-mac）

# ---------------------------------------------------------------------------
# VAD：语音活动检测（Silero，CPU 小模型，与平台无关）
# ---------------------------------------------------------------------------
vad:
  backend: silero
  min_silence_ms: 64

# ---------------------------------------------------------------------------
# STT：SenseVoiceSmall（FunASR 官方支持 mps；CPU 都 17x 实时，M5 无压力）
# ---------------------------------------------------------------------------
stt:
  backend: sensevoice
  model_name: iic/SenseVoiceSmall
  device: mps
  language: zh

# ---------------------------------------------------------------------------
# LLM：DeepSeek API（deepseek-v4-flash）。本地 8B 实测回复质量不达标，
# 弃用本地脑；key 放 .env.local 的 DEEPSEEK_API_KEY。
# 回退本地脑：llama-server 跑 GGUF，base_url 换 http://127.0.0.1:8081/v1、
# model_name 换对应 alias、api_key_env 换 LLM_API_KEY。
# ---------------------------------------------------------------------------
llm:
  backend: chat-completions
  model_name: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  stream: true
  stream_batch_sentences: 1
  chat_size: 30
  reasoning_effort: "none"   # 关思考模式（deepseek-v4-flash 默认思考，先想 ~2s 才开口）

# ---------------------------------------------------------------------------
# TTS：Qwen3-TTS（上游内置后端，Mac 自动走 mlx-audio）。
# Base 变体 = 零样本音色克隆（良子 ref.wav + ref.txt 由启动参数注入）；
# Apple Silicon 自动映射到 mlx-community 6bit 版（~2G，M5 实测速度待验收）。
# 克隆质量/速度不达标时的退路：云克隆 TTS API（MiniMax/百炼 CosyVoice）。
# ---------------------------------------------------------------------------
tts:
  backend: qwen3                                 # 上游注册名（CLI 选项是 --tts qwen3）
  model_name: Qwen/Qwen3-TTS-12Hz-1.7B-Base   # Base=克隆；CustomVoice=预设音色
  device: auto                                 # darwin 上自动选 mlx-audio
  sample_rate: 16000                           # 管线全程 16kHz，勿改

# ---------------------------------------------------------------------------
# Avatar：本地无数字人（TensorRT/NVIDIA 专用，Mac 无法运行）
# ---------------------------------------------------------------------------
avatar:
  enabled: false

# ---------------------------------------------------------------------------
# WebRTC 音画轨：本地 localhost 直连（host candidate），无需 coturn/TURN
# ---------------------------------------------------------------------------
rtc:
  enabled: true
  video_bitrate: 4000000
  browser_ice_servers: []

# ---------------------------------------------------------------------------
# 人设注册表（良子唯一）
# ---------------------------------------------------------------------------
personas:
  default: liangzi
  list:
    liangzi: personas/liangzi.md

# ---------------------------------------------------------------------------
# 服务参数
# ---------------------------------------------------------------------------
server:
  s2s_host: 127.0.0.1
  s2s_port: 8765
  host: 127.0.0.1              # 本地版只绑回环
  port: 8000
  log_level: info
  enable_live_transcription: false
  num_pipelines: 1
