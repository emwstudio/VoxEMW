# VoxEMW 本地 Mac 极简版 —— Apple Silicon（M5 16GB），无数字人/无唱歌
#
# 形态：
# - 无数字人（AVTR-1 是 TensorRT/NVIDIA 专用，Mac 死路）：avatar.enabled: false，
#   前端自动降级纯语音模式（静态肖像）
# - STT/TTS 走 MPS（Apple GPU）；LLM 走 DeepSeek API（key 从 .env.local 读）
# - RTC 保留（aiortc 在 Mac 正常，音频下行唯一通道）：localhost 直连，
#   不需要 coturn/TURN（host candidate 即可）
#
# 用法：
#   bash scripts/start_mac.sh    # pipeline + orchestrator（皆 .venv-mac）

# ---------------------------------------------------------------------------
# VAD：语音活动检测（Silero，CPU 小模型，与平台无关）
# ---------------------------------------------------------------------------
vad:
  backend: silero
  min_silence_ms: 64

# ---------------------------------------------------------------------------
# STT：Qwen3-ASR-0.6B-hf（transformers 原生，bf16 走 MPS；2026-08-23 M5 实测
# A/B：人设黑话+热词四段满分。自回归，2-5s 短句 0.3-1.0s——用户拍板
# 用每轮 ~0.5s 换准确率）。
# hotwords：人设词表，经 chat-template system 注入（"Vocabulary: ..."）。
# ---------------------------------------------------------------------------
stt:
  backend: qwen3asr
  model_name: Qwen/Qwen3-ASR-0.6B-hf
  device: auto                  # device_map=auto → MPS
  language: Chinese
  hotwords: [大胃袋, 味真足, 任丘, 锅贴, 大窑, 胃袋, 良子, 李占良, 哎妈呀, 嘎嘎]

# ---------------------------------------------------------------------------
# LLM：DeepSeek API（deepseek-v4-flash，key 放 .env.local 的
# DEEPSEEK_API_KEY）。本地 8B 脑实测回复质量不达标，已彻底弃用并删除。
# ---------------------------------------------------------------------------
llm:
  backend: chat-completions
  model_name: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  stream: true
  stream_batch_sentences: 1
  chat_size: 30
  reasoning_effort: "none"   # 关思考模式（deepseek-v4-flash 默认思考，先想 ~2s 才开口）

# ---------------------------------------------------------------------------
# TTS：Qwen3-TTS（上游内置后端，Mac 自动走 mlx-audio）。
# Base 变体 = 零样本音色克隆（良子 ref.wav + ref.txt 由启动参数注入）；
# Apple Silicon 自动映射到 mlx-community 6bit 版（~2G）。
# ---------------------------------------------------------------------------
tts:
  backend: qwen3                                 # 上游注册名（CLI 选项是 --tts qwen3）
  model_name: Qwen/Qwen3-TTS-12Hz-1.7B-Base   # Base=克隆；CustomVoice=预设音色
  device: auto                                 # darwin 上自动选 mlx-audio
  sample_rate: 16000                           # 管线全程 16kHz，勿改

# ---------------------------------------------------------------------------
# Avatar：本地无数字人（TensorRT/NVIDIA 专用，Mac 无法运行）
# ---------------------------------------------------------------------------
avatar:
  enabled: false

# ---------------------------------------------------------------------------
# WebRTC 音画轨：本地 localhost 直连（host candidate），无需 coturn/TURN
# ---------------------------------------------------------------------------
rtc:
  enabled: true
  video_bitrate: 4000000
  browser_ice_servers: []

# ---------------------------------------------------------------------------
# 人设注册表（良子唯一）
# ---------------------------------------------------------------------------
personas:
  default: liangzi
  list:
    liangzi: personas/liangzi.md

# ---------------------------------------------------------------------------
# 服务参数
# ---------------------------------------------------------------------------
server:
  s2s_host: 127.0.0.1
  s2s_port: 8765
  host: 127.0.0.1              # 本地版只绑回环
  port: 8000
  log_level: info
  enable_live_transcription: false
  num_pipelines: 1
