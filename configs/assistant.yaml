# VoxEMW 数字人实时语音助手 —— AutoDL RTX 4090D（24GB 单卡）
#
# 六段积木：vad（语音活动检测）/ stt（语音转文字）/ llm（对话模型）/
#           tts（文字转语音）/ avatar（数字人形象）/ personas（人设注册表）
#
# 架构：huggingface/speech-to-speech 管线（pip 依赖，运行时注册自定义积木）
#        浏览器 ↔ orchestrator（voxemw.avatar.orchestrator，:8000）
#                ↔ s2s realtime ws（:8765，内部）
#                ↔ avatar service（voxemw.avatar.service，:8767，内部）
#
# 用法：
#   python -m voxemw.pipeline.launch                 # s2s 语音管线（GPU 进程）
#   python -m voxemw.avatar.service                  # 数字人服务（GPU 进程）
#   python -m voxemw.avatar.orchestrator             # 编排 + Web 入口（CPU 进程）

# ---------------------------------------------------------------------------
# VAD：语音活动检测。上游只有 silero 一种实现，只能调参不能换。
# ---------------------------------------------------------------------------
vad:
  backend: silero
  # 判停静音时长：上游默认 64ms 太灵，稍微停顿就被切断；900ms 实测等待感偏强。
  # 600→500ms：pipeline 的 speculative reopen 会接住误断，压低 100ms 响应延迟
  min_silence_ms: 500
  # thresh: 0.6             # 检测阈值，越大越严格
  # min_speech_ms: 384      # 最短有效语音
  # speech_pad_ms: 500      # 段前保留音频

# ---------------------------------------------------------------------------
# STT：语音转文字。qwen3asr = 自定义积木（voxemw.pipeline.stt_qwen3asr），
# Qwen3-ASR transformers 本地推理，中文首选。24GB 显存紧张可降 0.6B。
# ---------------------------------------------------------------------------
stt:
  backend: qwen3asr
  model_name: Qwen/Qwen3-ASR-1.7B-hf   # 备选 Qwen/Qwen3-ASR-0.6B-hf
  device: cuda
  torch_dtype: bfloat16
  language: Chinese                     # 语言提示，跳过自动语种检测
  gen_max_new_tokens: 256

# ---------------------------------------------------------------------------
# LLM：对话模型。chat-completions = OpenAI 兼容 /v1/chat/completions。
# DeepSeek 关 thinking 由 launch.py 在 extra_body 里处理（thinking.type=disabled）；
# 不要配 reasoning_effort: none——DeepSeek 只认 high/low/medium/max/xhigh，none 会 400。
# ---------------------------------------------------------------------------
llm:
  backend: chat-completions
  model_name: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY    # 从环境变量读 key（启动时加载 .env.local），缺失即报错
  # 流式：逐句送 TTS，长回复首音从等整段 3-5s 降到 ~0.5s，代价是语调上下文略平；
  # 回退：stream: false（整段送 TTS，prosody 更自然）
  stream: true
  stream_batch_sentences: 1    # 攒几句送一次 TTS：1 = 逐句，首音最快
  chat_size: 30                    # 多轮历史上限

# ---------------------------------------------------------------------------
# TTS：文字转语音。voxcpm = 自定义积木（voxemw.pipeline.tts_voxcpm），
# openbmb/VoxCPM2：Ultimate Cloning 音色克隆 + 流式输出（48kHz → 16kHz）。
# 音色表自动取 personas 注册表全员（启动时预编码 prompt cache，
# 前端切换人设时经 session.update 的 audio.output.voice 热切换，无需重启）。
# ---------------------------------------------------------------------------
tts:
  backend: voxcpm
  model_name: openbmb/VoxCPM2
  device: cuda                           # 别写 cuda:0——官方 optimize() 只认字符串 "cuda"
  sample_rate: 16000                     # 管线全程 16kHz，勿改
  blocksize: 512
  cfg_value: 2.0                         # 官方推荐值；越大越贴近参考音色，过高会僵硬
  inference_timesteps: 10                # 扩散步数,官方推荐 10；调低更快更糙
  optimize: true                         # torch.compile：启动慢一两分钟，RTF ~1.0 → ~0.3-0.5
  # load_denoiser: true                  # 参考音频有底噪再开（额外下 ModelScope 降噪模型）

# ---------------------------------------------------------------------------
# Avatar：数字人形象。flashhead = Soul-AILab/SoulX-FlashHead-1_3B Lite，
# 一张参考肖像（persona frontmatter 的 ref_image）+ TTS 音频流 → 实时说话头视频。
# 独立 GPU 进程（voxemw.avatar.service），orchestrator 经 ws 推送音频、收视频帧。
# enabled: false 或 persona 缺 ref_image 时自动降级为纯语音模式。
# ---------------------------------------------------------------------------
avatar:
  backend: flashhead
  enabled: true
  model_dir: models/SoulX-FlashHead-1_3B      # 相对仓库根；含 Lite 权重
  wav2vec_dir: models/wav2vec2-base-960h      # 音频特征提取器
  device: cuda
  fps: 15                              # 推流帧率目标（4090 实时可到 25，先保守）
  jpeg_quality: 95                     # LAN/隧道带宽充足,95 块效应基本不可见
  port: 8767                           # avatar service 内部 ws 端口
  host: 127.0.0.1

# ---------------------------------------------------------------------------
# Vision：外貌描述（可选积木，缺 key/整段删除即关闭，不影响语音链路）。
# 场景：LLM 是纯文本看不见用户。persona 说出暗号（trigger）→ 前端截一帧摄像头
# → orchestrator 调 Kimi 多模态拿客观描述 → 注入对话让 persona 锐评。
# Kimi 视觉只收 base64 图片（不收公网 URL），key 在 platform.moonshot.cn 申请。
# ---------------------------------------------------------------------------
vision:
  backend: kimi                        # OpenAI 兼容多模态接口
  model_name: kimi-k3
  base_url: https://api.moonshot.cn/v1 # AutoDL 国内直连；海外用 https://api.kimi.com/v1
  api_key_env: KIMI_API_KEY
  max_tokens: 600   # kimi-k3 是 thinking 模型，reasoning 会吃掉配额，多给余量
  trigger: 让我好好看看你               # 暗号短语：persona 原句说出，前端检测后截帧

# ---------------------------------------------------------------------------
# 人设注册表：key = persona id（前端切换、TTS 音色名都用它），
# value = 女娲蒸馏产物。每个文件的 frontmatter 声明三件套：
#   name（显示名）/ ref_wav（音色参考音）/ ref_text（逐字台词）/ ref_image（数字人肖像）
# ---------------------------------------------------------------------------
personas:
  default: fengge
  list:
    fengge: personas/fengge.md

# ---------------------------------------------------------------------------
# 服务参数。
# ---------------------------------------------------------------------------
server:
  s2s_host: 127.0.0.1       # s2s realtime ws（orchestrator 内部连接，不对外）
  s2s_port: 8765
  host: 0.0.0.0             # orchestrator 对外（Web 静态页 + ws）
  port: 8000
  log_level: info
  # 说话中每 0.5s 送一块中间音频给 STT 做实时预览（上游默认开）。前端只展示
  # 最终转写，开着只会让 STT 反复转写片段、浪费 GPU；关掉后 STT 只处理完整语音段
  enable_live_transcription: false
  num_pipelines: 1          # 并发会话数 = 隔离管线数；每多一条多一份模型显存，24GB 保持 1
