<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPad 全屏:加到主屏幕后独立打开,无地址栏;状态栏随页面底色 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <title>VoxEMW · 数字人语音助手</title>
  <link rel="stylesheet" href="/static/style.css?v=20260813c" />
</head>
<body>
  <main class="stage">
    <header class="topbar">
      <h1>VoxEMW</h1>
      <span id="status" class="status">未连接</span>
    </header>

    <section class="call-view">
      <div class="cam-wrap" id="cam-wrap">
        <video id="user-cam" autoplay muted playsinline></video>
        <div id="cam-fallback" class="cam-fallback">摄像头未开启</div>
        <span class="pane-label">你</span>
      </div>
      <div class="avatar-wrap">
        <img id="avatar-still" alt="数字人肖像" />
        <video id="avatar-video" autoplay muted playsinline></video>
        <div id="avatar-fallback" class="avatar-fallback hidden">纯语音模式（数字人未就绪）</div>
        <span class="pane-label" id="avatar-label">峰哥</span>
        <span id="avatar-state" class="hidden"></span>
        <button id="img-upload-btn" class="img-upload" title="更换数字人肖像（16:9 横版胸像最佳）">换图</button>
        <input type="file" id="img-upload" accept="image/*" class="hidden" />
      </div>
      <!-- 跳舞舞台：点舞触发，全屏播放素材，播完/点击关闭 -->
      <div id="dance-stage" class="dance-stage hidden">
        <div class="stage-beam beam-l"></div>
        <div class="stage-beam beam-r"></div>
        <div class="stage-beam beam-c"></div>
        <div class="dance-logo">峰哥<span>跳舞秀</span></div>
        <div class="dance-stamp">梦想大舞台</div>
        <div class="dance-eq eq-l"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="dance-eq eq-r"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="dance-ticker"><div class="ticker-track" id="ticker-track"></div></div>
        <video id="dance-video" playsinline></video>
        <span class="dance-hint">点击任意处返回通话</span>
      </div>
    </section>

    <nav id="persona-bar" class="persona-bar" aria-label="人设切换"></nav>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <footer class="controls">
      <button id="mic-btn" class="mic-btn" disabled>🎙 开始对话</button>
      <p class="hint">开始后直接说话即可，随时可以打断她/他。</p>
    </footer>
  </main>
  <script src="/static/assistant.js?v=20260813c"></script>
</body>
</html>
