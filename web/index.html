<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPad 全屏:加到主屏幕后独立打开,无地址栏;状态栏随页面底色 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070b1a" />
  <title>河南妮儿语音助手 · DeepSeek 驱动</title>
  <!-- 数字人（VRM）依赖：本地 vendor 的 three + @pixiv/three-vrm，importmap 免构建 -->
  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three/build/three.module.js",
      "three/addons/": "/static/vendor/three/examples/jsm/",
      "@pixiv/three-vrm": "/static/vendor/three-vrm/three-vrm.module.js"
    }
  }
  </script>
  <link rel="stylesheet" href="/static/style.css?v=20260825b" />
</head>
<body>
  <canvas id="space"></canvas>
  <canvas id="vrm"></canvas>
  <main class="stage">
    <header class="topbar">
      <h1>河南妮儿语音助手</h1>
      <span id="status" class="status">未连接</span>
    </header>

    <nav id="persona-bar" class="persona-bar" aria-label="人设切换"></nav>

    <section class="transcript" id="transcript" aria-live="polite">
      <p class="empty-hint" id="empty-hint">说点什么吧…</p>
    </section>

    <footer class="controls">
      <div class="orb" id="orb">
        <button id="mic-btn" class="mic-btn" disabled aria-label="开始对话">🎙</button>
      </div>
      <p class="hint">点一下开聊，随时可以打断他 · DeepSeek 驱动</p>
    </footer>
  </main>
  <script src="/static/assistant.js?v=20260825g"></script>
  <script type="module" src="/static/avatar-vrm.js?v=20260825m"></script>
</body>
</html>
