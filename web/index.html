<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPad 全屏:加到主屏幕后独立打开,无地址栏;状态栏随页面底色 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#150a24" />
  <title>魔镜女巫语音助手 · DeepSeek 驱动</title>
  <link rel="stylesheet" href="/static/style.css?v=20260830c" />
</head>
<body>
  <canvas id="space"></canvas>
  <main class="stage">
    <header class="topbar">
      <h1>魔镜女巫语音助手</h1>
      <span id="status" class="status">未连接</span>
    </header>

    <nav id="persona-bar" class="persona-bar" aria-label="人设切换"></nav>

    <section class="avatar-stage" id="avatar-stage" hidden>
      <div class="magic-mirror" id="magic-mirror">
        <canvas id="avatar-canvas" width="512" height="512"></canvas>
        <div class="water-mirror">
          <video id="cam-preview" muted playsinline hidden></video>
        </div>
      </div>
    </section>

    <section class="transcript" id="transcript" aria-live="polite" hidden>
      <p class="empty-hint" id="empty-hint">说点什么吧…</p>
    </section>

    <p class="caption" id="caption"></p>

    <footer class="controls">
      <div class="orb" id="orb">
        <button id="mic-btn" class="mic-btn" disabled aria-label="开始对话">🎙</button>
      </div>
      <p class="hint">点一下唤醒魔镜，随时可以打断她 · DeepSeek 驱动</p>
    </footer>
  </main>
  <script src="/static/assistant.js?v=20260830c"></script>
</body>
</html>
