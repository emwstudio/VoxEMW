<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPad 全屏:加到主屏幕后独立打开,无地址栏;状态栏随页面底色 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070b1a" />
  <title>良子语音助手 · DeepSeek 驱动</title>
  <link rel="stylesheet" href="/static/style.css?v=20260823i" />
</head>
<body>
  <canvas id="space"></canvas>
  <main class="stage">
    <header class="topbar">
      <h1>良子语音助手</h1>
      <span class="powered">DeepSeek 驱动</span>
      <span id="status" class="status">未连接</span>
    </header>

    <nav id="persona-bar" class="persona-bar" aria-label="人设切换"></nav>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <footer class="controls">
      <button id="mic-btn" class="mic-btn" disabled>🎙 开始对话</button>
      <p class="hint">点开始后直接说话即可，随时可以打断他。</p>
    </footer>
  </main>
  <script src="/static/assistant.js?v=20260823i"></script>
</body>
</html>
