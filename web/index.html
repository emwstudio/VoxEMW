<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPad 全屏:加到主屏幕后独立打开,无地址栏;状态栏随页面底色 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070b1a" />
  <title>良子语音助手 · DeepSeek 驱动</title>
  <link rel="stylesheet" href="/static/style.css?v=20260823d" />
</head>
<body>
  <canvas id="space"></canvas>
  <main class="stage">
    <header class="topbar">
      <h1>良子语音助手</h1>
      <span class="powered">DeepSeek 驱动</span>
      <span id="status" class="status">未连接</span>
    </header>

    <section class="call-view">
      <div class="avatar-wrap">
        <img id="avatar-still" alt="良子肖像" />
        <div id="avatar-fallback" class="avatar-fallback hidden">良子 · 语音版</div>
        <span class="pane-label" id="avatar-label">良子</span>
        <span id="avatar-state" class="hidden"></span>
        <button id="img-upload-btn" class="img-upload" title="更换肖像（16:9 横版胸像最佳）">换图</button>
        <input type="file" id="img-upload" accept="image/*" class="hidden" />
      </div>
    </section>

    <nav id="persona-bar" class="persona-bar" aria-label="人设切换"></nav>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <footer class="controls">
      <button id="mic-btn" class="mic-btn" disabled>🎙 开始对话</button>
      <p class="hint">点开始后直接说话即可，随时可以打断她。</p>
    </footer>
  </main>
  <script src="/static/assistant.js?v=20260823d"></script>
</body>
</html>
