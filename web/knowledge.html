<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>VoxEMW · 知识库管理</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .meta { color: var(--dim); font-size: 12px; }
    button { background: var(--accent); color: #04121f; border: 0; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    button.ghost { background: transparent; color: #f85149; border: 1px solid #f8514966; padding: 4px 10px; font-size: 12px; }
    button:disabled { opacity: 0.5; cursor: default; }
    input[type=file] { display: none; }
    .doc { padding: 10px 0; border-top: 1px solid var(--border); }
    .doc:first-of-type { border-top: 0; }
    #job { color: var(--accent); font-size: 13px; margin-top: 8px; }
    .empty { color: var(--dim); text-align: center; padding: 24px 0; font-size: 13px; }
    a { color: var(--accent); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <div class="row" style="margin-bottom:4px">
    <h1 class="grow">知识库</h1>
    <a href="/">← 返回对话</a>
  </div>
  <div class="sub">上传 PDF 资料，峰哥回答相关问题时会参考（相似度低于阈值不引用）。</div>

  <div class="card">
    <div class="row">
      <label class="grow">
        <button type="button" onclick="document.getElementById('file').click()">上传 PDF</button>
        <input id="file" type="file" accept="application/pdf" />
      </label>
      <span id="fname" class="meta"></span>
    </div>
    <div id="job"></div>
  </div>

  <div class="card" id="list"><div class="empty">加载中…</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let pollTimer = null;

async function refresh() {
  const res = await fetch("/api/knowledge/list");
  const data = await res.json();
  const jobs = data.jobs || {};
  const list = $("list");
  if (!data.docs.length && !Object.keys(jobs).length) {
    list.innerHTML = '<div class="empty">还没有文档，传一份 PDF 试试</div>';
  } else {
    list.innerHTML = "";
    for (const [name, st] of Object.entries(jobs)) {
      list.innerHTML += `<div class="doc row"><span class="name grow">${name}</span><span class="meta">${st}</span></div>`;
    }
    for (const d of data.docs) {
      list.innerHTML += `<div class="doc row"><div class="grow"><div class="name">${d.doc_name}</div>` +
        `<div class="meta">${d.chunks} 块 · ${d.created_at}</div></div>` +
        `<button class="ghost" onclick="delDoc('${encodeURIComponent(d.doc_name)}')">删除</button></div>`;
    }
  }
  const active = Object.values(jobs).some((s) => !s.startsWith("完成") && !s.startsWith("失败"));
  if (active && !pollTimer) pollTimer = setInterval(refresh, 1500);
  if (!active && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  $("fname").textContent = f.name;
  $("job").textContent = "上传中…";
  const fd = new FormData();
  fd.append("file", f);
  const res = await fetch("/api/knowledge/upload", { method: "POST", body: fd });
  const data = await res.json();
  $("job").textContent = res.ok ? "已受理，正在后台解析入库，进度见下 ⬇" : `失败：${data.error}`;
  e.target.value = "";
  refresh();
});

async function delDoc(name) {
  if (!confirm("删除该文档？删除后峰哥将不再参考它。")) return;
  await fetch("/api/knowledge/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ doc_name: decodeURIComponent(name) }),
  });
  refresh();
}

refresh();
</script>
</body>
</html>
